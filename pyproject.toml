[project]
name = "refract"
dynamic = ["version"]
description = "Graphing and statistics app that reads and writes GraphPad Prism files"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
refract = "refract.cli:main"

[project.optional-dependencies]
render = ["PySide6-Essentials>=6.8"]
package = ["pyinstaller>=6.10", "PySide6-Essentials>=6.8"]
dev = ["pytest>=8", "ruff>=0.6", "pypdfium2>=4", "pillow>=10", "numpy>=1.26", "PySide6-Essentials>=6.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.version]
path = "refract/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
